<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>自定义下拉选择框</title>

  <style>
    /* 用户自定义颜色 */
    z-dropdown-option.red {
      color: #e74c3c;
      font-weight: bold;
    }
    z-dropdown-option.green {
      color: #27ae60;
    }

    /* 测试按钮样式 */
    .test-buttons {
      margin: 10px 0;
    }
    .test-btn {
      padding: 6px 12px;
      margin-right: 8px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #fff;
    }
    .test-btn:hover {
      background: #f5f5f5;
    }
  </style>
</head>
<body>
<h2>自定义下拉选择框</h2>

<!-- 测试按钮 -->
<div class="test-buttons">
  <button class="test-btn" onclick="setJs()">设置值为：js</button>
  <button class="test-btn" onclick="setTop()">设置值为：@top</button>
</div>

<form id="myForm">
  <z-dropdown name="language" value="js" placeholder="请选择语言">
    <z-dropdown-option value="html" class="red">HTML5（第一个）</z-dropdown-option>
    <z-dropdown-option value="css" class="green">CSS3</z-dropdown-option>
    <z-dropdown-option value="js">JavaScript</z-dropdown-option>
    <z-dropdown-option value="vue">Vue.js</z-dropdown-option>
    <z-dropdown-option value="python">Python</z-dropdown-option>
    <z-dropdown-option value="java">Java</z-dropdown-option>
    <z-dropdown-option value="java_long">Java-Java-Java-Java-Java-Java-Java-Java-Java超长测试</z-dropdown-option>
    <z-dropdown-option value="csharp">C#</z-dropdown-option>
    <z-dropdown-option value="php">PHP</z-dropdown-option>
  </z-dropdown>

  <br><br>
  <button type="submit">提交</button>
</form>

<h3>选中结果：<span id="result" style="color:red"></span></h3>

<script>
// ==================== z-dropdown-option ====================
class ZDropdownOption extends HTMLElement {
  static get observedAttributes() { return ['value']; }
  constructor() { super(); }
  get value() { return this.getAttribute('value'); }
  get label() { return this.textContent.trim(); }
}

// ==================== z-dropdown ====================
class ZDropdown extends HTMLElement {
  static formAssociated = true;
  static get observedAttributes() { return ['value']; }

  constructor() {
    super();
    this.attachShadow({ mode: 'open' });
    this.internals = this.attachInternals();
    this.selectedValue = '';
    this.allOptions = [];
    this.activeIndex = -1;
  }

  get value() { return this.selectedValue; }
  set value(val) {
    if (val === '@top' && this.allOptions.length > 0) {
      val = this.allOptions[0].value;
    }

    this.selectedValue = val;
    this.internals.setFormValue(val);
    this.updateLabel();
    this.syncActive();
  }

  attributeChangedCallback(name, oldVal, newVal) {
    if (name === 'value') this.value = newVal;
  }

  connectedCallback() {
    if (!this.style.display) this.style.display = 'block';
    if (!this.style.width) {
      this.style.width = '100%';
      this.style.maxWidth = '400px';
    }
    
    this.cacheAllOptions();
    this.render();
    this.bindEvents();
    this.bindKeyboard();
    this.value = this.getAttribute('value') || '';
  }

  cacheAllOptions() {
    this.allOptions = Array.from(this.querySelectorAll('z-dropdown-option'));
  }

  updateLabel() {
    const el = this.shadowRoot.querySelector('.label');
    const opt = this.querySelector(`z-dropdown-option[value="${this.value}"]`);
    if (el) el.textContent = opt ? opt.label : this.getAttribute('placeholder');
  }

  syncActive() {
    this.allOptions.forEach(o => o.classList.remove('active'));
    const opt = this.querySelector(`z-dropdown-option[value="${this.value}"]`);
    if (opt) opt.classList.add('active');
  }

  filter(keyword) {
    this.allOptions.forEach((opt) => {
      const match = opt.label.toLowerCase().includes(keyword.toLowerCase());
      opt.style.display = match ? 'block' : 'none';
    });
  }

  navigate(direction) {
    const visible = this.allOptions.filter(o => o.style.display !== 'none');
    if (visible.length === 0) return;

    if (this.activeIndex === -1) {
      const curr = visible.findIndex(v => v.value === this.value);
      this.activeIndex = curr !== -1 ? curr : 0;
    } else {
      this.activeIndex += direction;
      if (this.activeIndex < 0) this.activeIndex = 0;
      if (this.activeIndex >= visible.length) this.activeIndex = visible.length - 1;
    }

    visible.forEach(v => v.classList.remove('active'));
    visible[this.activeIndex].classList.add('active');
  }

  confirmSelect() {
    const active = this.querySelector('z-dropdown-option.active');
    if (active) {
      this.value = active.value;
      this.shadowRoot.querySelector('.dropdown').classList.remove('open');
      this.dispatchEvent(new CustomEvent('change', {
        detail: { value: active.value, label: active.label }
      }));
    }
  }

  render() {
    const ph = this.getAttribute('placeholder') || '请选择';
    this.shadowRoot.innerHTML = `
    <style>
      .dropdown { position:relative; display:block; width:100%; font-family:Consolas, monospace, sans-serif; user-select:none; }
      .trigger { padding:0.5em 1em; border:1px solid #ccc; border-radius:6px; background:#fff; cursor:pointer; display:flex; justify-content:space-between; align-items:center; width:100%; box-sizing:border-box; }
      .search-box { padding:6px 8px; border-bottom:1px solid #eee; background:#fff; position:sticky; top:0; }
      .search-input { width:100%; box-sizing:border-box; padding:6px; border:1px solid #ddd; border-radius:4px; outline:none; font-family:Consolas, monospace, sans-serif; }
      .menu { position:absolute; top:100%; left:0; right:0; margin-top:4px; background:#fff; border:1px solid #bbb; border-radius:0; box-shadow:0 4px 10px rgba(0,0,0,0.1); display:none; z-index:999; max-height:280px; overflow-y:auto; width:100%; box-sizing:border-box; }
      .dropdown.open .menu { display:block; }
      .label { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

      ::slotted(z-dropdown-option) {
        color: #2c3e50; font-size:14px; padding:0.3em 1em; display:block; cursor:pointer; border-radius:4px;
      }
      ::slotted(z-dropdown-option:hover) {
        box-shadow: inset 0 0 5px #409eff;
      }
      ::slotted(z-dropdown-option.active) {
        box-shadow: inset 0 0 20px #409eff;
      }
    </style>

    <div class="dropdown">
      <div class="trigger">
        <span class="label">${ph}</span>
        <span>▼</span>
      </div>
      <div class="menu">
        <div class="search-box">
          <input class="search-input" placeholder="搜索">
        </div>
        <slot></slot>
      </div>
    </div>
    `;
  }

  bindEvents() {
    const dd = this.shadowRoot.querySelector('.dropdown');
    const trigger = this.shadowRoot.querySelector('.trigger');
    const search = this.shadowRoot.querySelector('.search-input');
    const searchBox = this.shadowRoot.querySelector('.search-box');
    searchBox.addEventListener('click', e => e.stopPropagation());
    search.addEventListener('click', e => e.stopPropagation());

    trigger.addEventListener('click', e => {
      e.stopPropagation();
      dd.classList.toggle('open');
      if (dd.classList.contains('open')) {
        search.value = '';
        this.filter('');
        search.focus();
        this.activeIndex = -1;
      }
    });

    search.addEventListener('input', e => {
      this.filter(e.target.value);
      this.activeIndex = -1;
    });

    this.addEventListener('click', e => {
      const opt = e.target.closest('z-dropdown-option');
      if (opt) {
        this.value = opt.value;
        dd.classList.remove('open');
        this.dispatchEvent(new CustomEvent('change', { detail: { value: opt.value, label: opt.label } }));
      }
    });

    document.addEventListener('click', () => dd.classList.remove('open'));
  }

  bindKeyboard() {
    const search = this.shadowRoot.querySelector('.search-input');
    search.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); this.navigate(1); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); this.navigate(-1); }
      else if (e.key === 'Enter') { e.preventDefault(); this.confirmSelect(); }
    });
  }
}

customElements.define('z-dropdown-option', ZDropdownOption);
customElements.define('z-dropdown', ZDropdown);
</script>

<script>
  const form = document.getElementById('myForm');
  const result = document.getElementById('result');
  const dropdown = document.querySelector('z-dropdown');

  dropdown.addEventListener('change', e => {
    result.textContent = `已选中：${e.detail.label} (${e.detail.value})`;
  });

  form.addEventListener('submit', e => {
    e.preventDefault();
    const formData = new FormData(form);
    console.log('表单提交：', Object.fromEntries(formData));
  });

  // ========== 测试按钮方法 ==========
  function setJs() {
    dropdown.value = 'js';
  }

  function setTop() {
    dropdown.value = '@top';
  }
</script>
</body>
</html>

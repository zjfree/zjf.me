<?xml version="1.0" encoding="UTF-8"?>
<svg width="520" height="100" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 100">
    <defs>
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <polygon points="10,50 30,10 490,10 510,50 490,90 30,90" fill="none" stroke="#000" stroke-width="1" />
    <polygon points="10,50 30,10 490,10 510,50 490,90 30,90" stroke="rgba(0,0,0,0.3)" stroke-width="1" fill="none" transform="scale(0.9)" style="transform-origin: 50% 50%;"  />
    <polyline points="20,30 30,10 55,10" fill="none" stroke="#0ff" stroke-width="4" filter="url(#glow)" />
    <polyline points="465,10 490,10 500,30" fill="none" stroke="#0ff" stroke-width="4" filter="url(#glow)" />
    <polyline points="500,70 490,90 465,90" fill="none" stroke="#0ff" stroke-width="4" filter="url(#glow)" />
    <polyline points="20,70 30,90 55,90" fill="none" stroke="#0ff" stroke-width="4" filter="url(#glow)" />

    
    <polyline points="30,90 10,50 30,10" stroke="#000" stroke-width="5" fill="none" transform="translate(15,0) scale(0.8)" style="transform-origin: 0% 50%;"  />
    <polyline points="490,10 510,50 490,90" stroke="#000" stroke-width="5" fill="none" transform="translate(-15,0) scale(0.8)" style="transform-origin: 100% 50%;"  />
</svg>
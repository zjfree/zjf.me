<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"  width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <!-- 中心辐射渐变 -->
    <radialGradient id="radial1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="white" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.1)" />
    </radialGradient>
    </defs>

    <path id="path1" d="M50,50 Q50,10 10,50" stroke="url(#radial1)" stroke-width="0.5" fill="none" />
    <circle cx="0" cy="0" r="3" stroke="none" stroke-width="0" fill="#fff">
        <animateMotion dur="3s" repeatCount="indefinite" rotate="auto">
            <mpath href="#path1" />
        </animateMotion>
    </circle>
    
    <path id="path2" d="M50,50 Q60,10 90,50" stroke="url(#radial1)" stroke-width="0.5" fill="none" />
    <circle cx="0" cy="0" r="3" stroke="none" stroke-width="0" fill="#fff">
        <animateMotion dur="3s" repeatCount="indefinite" rotate="auto" begin="1s">
            <mpath href="#path2" />
        </animateMotion>
    </circle>
    
    <path id="path3" d="M50,50 Q70,10 60,90" stroke="url(#radial1)" stroke-width="0.5" fill="none" />
    <circle cx="0" cy="0" r="3" stroke="none" stroke-width="0" fill="#fff">
        <animateMotion dur="3s" repeatCount="indefinite" rotate="auto" begin="2s">
            <mpath href="#path3" />
        </animateMotion>
    </circle>
    
    <path id="path4" d="M50,50 Q30,20 20,80" stroke="url(#radial1)" stroke-width="0.5" fill="none" />
    <circle cx="0" cy="0" r="3" stroke="none" stroke-width="0" fill="#fff">
        <animateMotion dur="3s" repeatCount="indefinite" rotate="auto" begin="3s">
            <mpath href="#path4" />
        </animateMotion>
    </circle>
</svg>
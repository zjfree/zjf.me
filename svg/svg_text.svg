<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="20" viewBox="0 0 100 20">
  <defs>
    <filter id="dropShadow">
      <!-- 阴影：向右偏移5px，向下偏移5px，模糊3px，红色半透明 -->
      <feDropShadow 
        dx="0" 
        dy="1" 
        stdDeviation="1" 
        flood-color="#ff5722" 
        flood-opacity="0.7" 
      />
    </filter>
    <linearGradient id="glowGradient">
      <stop offset="0%" stop-color="white" stop-opacity="0" />
      <stop offset="45%" stop-color="white" stop-opacity="0.8" />
      <stop offset="55%" stop-color="white" stop-opacity="0.8" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
    <mask id="txtMask">
    <text x="50" y="10" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#fff" stroke="#fff" stroke-width="0.1">
        顶部标题 Abc123
    </text>
    </mask>
  </defs>
    <text x="50" y="10" font-size="12" text-anchor="middle" dominant-baseline="middle" font-weight="bold" fill="#000" stroke="#0f0" stroke-width="0.1" filter="url(#dropShadow)">
        顶部标题 Abc123
    </text>
    <g  mask="url(#txtMask)">
      <g>
        <rect x="45" y="-10" width="10" height="40" fill="url(#glowGradient)" stroke="none" stroke-width="0" transform-origin="50% 50%" transform="rotate(45)"/>
        <animateTransform attributeName="transform" type="translate" from="-50 0" to="50 0" dur="3s" repeatCount="indefinite" additive="sum" />
      </g>
    </g>
</svg>
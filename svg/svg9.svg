<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="200" height="20" viewBox="0 0 200 20">
    <defs>
        <filter id="blur" x="-200%" y="-100%" width="400%" height="300%">
            <feGaussianBlur stdDeviation="3" />
        </filter>
        <filter id="blur2" x="-200%" y="-100%" width="400%" height="300%">
            <feGaussianBlur stdDeviation="1" />
        </filter>
        <circle id="c1" cx="100" cy="10" r="3" stroke="none" stroke-width="0" fill="#fff" transform="scale(1.3,0.8)" filter="url(#blur2)" style="transform-origin: 50% 50%;" />
        <circle id="c2" cx="100" cy="10" r="3" stroke="none" stroke-width="0" fill="#fff" transform="scale(2,1)" filter="url(#blur)" style="transform-origin: 50% 50%;" />
        <circle id="c3" cx="100" cy="10" r="5" stroke="none" stroke-width="0" fill="#ccf" transform="scale(10,0.1)" filter="url(#blur)" style="transform-origin: 50% 50%;" />
    </defs>
    <g x="0" y="0" style="transform-origin: 50% 50%;">
        <use href="#c3" />
    </g>
    <g x="0" y="0" style="transform-origin: 50% 50%;">
        <use href="#c2" />
    </g>
    <g x="0" y="0" style="transform-origin: 50% 50%;">
        <use href="#c1" />
    </g>
    <circle cx="100" cy="10" r="1" stroke="none" stroke-width="0" fill="#fff" opacity="1">
        <animateTransform attributeName="transform" type="translate" values="0 0;100 0" dur="5s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0" dur="5s" repeatCount="indefinite" />
    </circle>1
</svg>
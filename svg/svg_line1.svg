<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="10" viewBox="0 0 100 10">
    <defs>
        <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="rgba(0,0,0, 0)" />
        <stop offset="50%" stop-color="rgba(0,0,0, 1)" />
        <stop offset="100%" stop-color="rgba(0,0,0, 0)" />
        </linearGradient>
        <filter id="glow" x="-50%" y="-100%" width="200%" height="300%">
            <feGaussianBlur stdDeviation="1.5" result="blur" />
            <feMerge>
            <feMergeNode in="blur" />
            <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>
    <rect x="0" y="4" width="100" height="2" stroke="none" stroke-width="0" fill="url(#line)" />
    <rect x="45" y="3" rx="2" width="10" height="4" fill="#0ff" stroke-width="0"  filter="url(#glow)"/>
    <rect x="42" y="4.5" width="2" height="1" fill="#0ff" stroke-width="0"  filter="url(#glow)"/>
    <rect x="56" y="4.5" width="2" height="1" fill="#0ff" stroke-width="0"  filter="url(#glow)"/>
</svg>
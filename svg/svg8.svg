<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
    <defs>
        <filter id="blur" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="3" />
        </filter>
        <circle id="c1" cx="50" cy="50" r="5" stroke="none" stroke-width="0" fill="#ccf" transform="scale(5,0.3)" filter="url(#blur)" style="transform-origin: 50% 50%;" />
        <circle id="c2" cx="50" cy="50" r="5" stroke="none" stroke-width="0" fill="#ccf" transform="scale(4,0.3)" filter="url(#blur)" style="transform-origin: 50% 50%;" />
        <circle id="c3" cx="50" cy="50" r="5" stroke="none" stroke-width="0" fill="#ccf" transform="scale(3,0.3)" filter="url(#blur)" style="transform-origin: 50% 50%;" />
    </defs>
    <g x="0" y="0" transform="rotate(0)" style="transform-origin: 50% 50%;">
        <use href="#c1" />
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" />
    </g>
    <g x="0" y="0" transform="rotate(45)" style="transform-origin: 50% 50%;">
        <use href="#c2" />
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="0.5s" />
    </g>
    <g x="0" y="0" transform="rotate(90)" style="transform-origin: 50% 50%;">
        <use href="#c1" />
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" />
    </g>
    <g x="0" y="0" transform="rotate(135)" style="transform-origin: 50% 50%;">
        <use href="#c2" />
        <animate attributeName="opacity" values="0.5;1;0.5" dur="1s" repeatCount="indefinite" begin="0.5s" />
    </g>
    <circle cx="50" cy="50" r="5" stroke="none" stroke-width="0" fill="#fff" filter="url(#blur)" style="transform-origin: 50% 50%;" />
    <circle cx="50" cy="50" r="10" stroke="#fff" stroke-width="1" fill="none" opacity="1" filter="url(#blur)" style="transform-origin: 50% 50%;">
        <animateTransform attributeName="transform" type="scale" values="1;2" dur="3s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="1;0" dur="3s" repeatCount="indefinite" />
    </circle>
</svg>
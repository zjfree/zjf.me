<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- 定义发光滤镜 -->
  <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
    <!-- 高斯模糊：stdDeviation 控制模糊程度（发光范围） -->
    <feGaussianBlur stdDeviation="5" result="blur" />
    <!-- 合并原图形和模糊层（模糊层在下，原图形在上） -->
    <feMerge>
      <feMergeNode in="blur" /> <!-- 模糊层 -->
      <feMergeNode in="SourceGraphic" /> <!-- 原图形 -->
    </feMerge>
  </filter>
  <!-- 应用发光滤镜 -->
    <circle cx="50" cy="50" r="40" stroke-width="1" stroke="#eee"  fill="none"/>
    <circle cx="50" cy="50" r="40" stroke-width="5" stroke="#0ff"  fill="none" stroke-dasharray="0.5,10" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="100;0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="40" stroke-width="3" stroke="#0ff"  fill="none" filter="url(#glow)" stroke-dasharray="100, 10" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="0;110" dur="1s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="30" stroke-width="5" stroke="#0ff"  fill="none" filter="url(#glow)" stroke-dasharray="30, 40" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="70;170;0" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="30" stroke-width="3" stroke="#ff0"  fill="none" filter="url(#glow)" stroke-dasharray="5, 100" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="0;-100" dur="15s" repeatCount="indefinite" />
    </circle>
    <circle cx="50" cy="50" r="20" stroke-width="10" stroke="#0ff"  fill="none" stroke-dasharray="50, 10" stroke-dashoffset="0">
        <animate attributeName="stroke-dashoffset" values="0;100;90;0" dur="7s" repeatCount="indefinite" />
    </circle>
    
    <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#eee" opacity="1.0" fill="none" stroke-dasharray="2,1" stroke-dashoffset="0"/>
    <g>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="1.0" fill="none" stroke-dasharray="2,100" stroke-dashoffset="0"/>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="0.9" fill="none" stroke-dasharray="2,100" stroke-dashoffset="-3"/>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="0.8" fill="none" stroke-dasharray="2,100" stroke-dashoffset="-6"/>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="0.7" fill="none" stroke-dasharray="2,100" stroke-dashoffset="-9"/>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="0.6" fill="none" stroke-dasharray="2,100" stroke-dashoffset="-12"/>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="0.5" fill="none" stroke-dasharray="2,100" stroke-dashoffset="-15"/>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="0.4" fill="none" stroke-dasharray="2,100" stroke-dashoffset="-18"/>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="0.3" fill="none" stroke-dasharray="2,100" stroke-dashoffset="-21"/>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="0.2" fill="none" stroke-dasharray="2,100" stroke-dashoffset="-24"/>
        <circle cx="50" cy="50" r="10" stroke-width="2" stroke="#333" opacity="0.1" fill="none" stroke-dasharray="2,100" stroke-dashoffset="-27"/>
        <animateTransform attributeName="transform" type="rotate" from="360 50 50" to="0 50 50" dur="5s" repeatCount="indefinite" />
    </g>
</svg>